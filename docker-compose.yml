version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codemind-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://codemind:codemind123@postgres:5432/codemind_dna
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - backend_data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: codemind-db
    environment:
      POSTGRES_USER: codemind
      POSTGRES_PASSWORD: codemind123
      POSTGRES_DB: codemind_dna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemind -d codemind_dna"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  backend_data:
