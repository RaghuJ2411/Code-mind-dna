name: Build & Deploy Frontend to Render
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Trigger Render deploy (frontend)
        run: |
          echo "Triggering frontend deploy"
          curl -sS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_FRONTEND }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
      - name: Show frontend service info
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          echo "Frontend service info:"
          curl -sS "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_FRONTEND }}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq '.'
name: Build & Deploy Frontend to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Deploy to Render
        uses: render-actions/render-deploy@v1
        with:
          api_key: ${{ secrets.RENDER_API_KEY }}
          service_id: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
