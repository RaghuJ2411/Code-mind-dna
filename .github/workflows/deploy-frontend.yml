name: Build & Deploy Frontend to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Validate Render secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_FRONTEND: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
        run: |
          test -n "${RENDER_API_KEY}" || (echo "::error::Missing RENDER_API_KEY secret" && exit 1)
          test -n "${RENDER_SERVICE_ID_FRONTEND}" || (echo "::error::Missing RENDER_SERVICE_ID_FRONTEND secret" && exit 1)

      - name: Trigger Render deploy (frontend)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_FRONTEND: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
        run: |
          curl -sS -f -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_FRONTEND}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Show frontend service info
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_FRONTEND: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          curl -sS -f "https://api.render.com/v1/services/${RENDER_SERVICE_ID_FRONTEND}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" | jq '.'
